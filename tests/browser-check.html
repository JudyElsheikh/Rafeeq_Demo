<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Rafeeq layout checks</title></head><body><h1>Rafeeq layout checks</h1><pre id="results">Running...</pre><iframe title="Showcase under test" style="width:1280px;height:1000px"></iframe><script>
(async()=>{let lines=[],fail=0,count=0;const frame=document.querySelector('iframe');function check(ok,label){count++;if(!ok)fail++;lines.push((ok?'PASS ':'FAIL ')+label)}function load(path){return new Promise((resolve,reject)=>{let timer=setTimeout(()=>reject(Error('Timeout '+path)),10000);frame.onload=()=>{clearTimeout(timer);resolve(frame.contentWindow)};frame.src='../'+path})}
try{let w=await load('index.html'),d=w.document;
check(!d.querySelector('.sidebar'),'Sidebar removed');check(!d.querySelector('#presentation'),'Presentation controls removed');check(!d.querySelector('input[type=search]'),'No home search');check(d.querySelector('.hero a')?.getAttribute('href')==='discover.html','Banner opens Discover Rafeeq');check(!d.querySelector('.stats,.roadmap-grid,.overview-bottom'),'Previous home blocks removed');check(d.querySelector('.hero').nextElementSibling.id==='use-cases','Use cases immediately follow banner');check(d.querySelector('#use-cases').nextElementSibling.id==='implementation-phases','Phases follow use cases');check(d.querySelectorAll('details.use-case').length===5,'Exactly five expandable use cases');check(d.querySelectorAll('.feature-row').length===22,'Use cases match latest feature document');
check(d.querySelector('.topbar .brand').textContent==='Rafeeq'&&!d.querySelector('.brand-mark,.brand-ar,.eco-symbol'),'Text-only Rafeeq brand');
check([...d.querySelectorAll('.phase-list-scroll')].every(el=>w.getComputedStyle(el).scrollbarWidth==='none'),'Phase scrollbars hidden');
check([...d.querySelectorAll('.phase-entries li:last-child')].every(el=>w.getComputedStyle(el).borderBottomWidth==='0px'),'No divider after last phase row');
check([...d.querySelectorAll('.home-phase')].every(el=>w.getComputedStyle(el).borderTopWidth==='1px'),'Phase cards have no accent stripe');
check(!d.querySelector('.breadcrumbs'),'No home breadcrumb');check(d.querySelectorAll('.phase-3 .phase-entries li').length===17,'Phase 3 has 17 entries');check(d.querySelectorAll('.phase-3 .ai-option-name').length===7,'Seven Phase 3 feature names indicate AI options');check(!!d.querySelector('.phase-3 .ai-option-note')&&!d.querySelector('.phase-4 .ai-option-note'),'AI option note appears in Phase 3 only');check(d.querySelector('#use-cases h2').textContent==='Features','Features heading');check(d.querySelectorAll('[role="tab"]').length===3,'Three feature tabs');d.querySelector('#tab-shared').click();check(!d.querySelector('#panel-shared').hidden&&d.querySelector('#panel-usecases').hidden,'Shared tab switches panels');check(d.querySelectorAll('#panel-shared .capability-disclosure').length===4,'Four shared capabilities');let sharedFeature=d.querySelector('#panel-shared .feature-disclosure');check(!sharedFeature.open,'Descriptions collapsed initially');sharedFeature.querySelector('summary').click();check(sharedFeature.open&&sharedFeature.querySelector('.feature-description').textContent.length>20,'Click reveals concise feature description');d.querySelector('#tab-additional').click();check(!d.querySelector('#panel-additional').hidden&&d.querySelectorAll('#panel-additional .capability-disclosure').length===4,'Four additional features');d.querySelector('#tab-additional').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Home',bubbles:true}));check(!d.querySelector('#panel-usecases').hidden,'Keyboard tab navigation');
let uc=d.querySelector('details');uc.querySelector('summary').click();check(uc.open,'Use case expands');let child=uc.querySelector('.feature-disclosure');child.querySelector('summary').click();check(child.open&&uc.open,'Feature description opens within use case');child.querySelector('summary').click();uc.querySelector('summary').click();check(!uc.open,'Use case collapses');check(d.querySelectorAll('.home-phase').length===4,'Four phase cards');check(d.querySelectorAll('.phase-entries li').length===40,'Updated phase entries preserved');check(d.querySelectorAll('.home-phase a').length===1&&d.querySelector('.home-phase a').getAttribute('href')==='phase1.html','Only Phase 1 links to a page');check([...d.querySelectorAll('a')].filter(a=>!a.getAttribute('href').startsWith('#')).every(a=>['phase1.html','index.html','discover.html'].includes(a.getAttribute('href'))),'Home navigation stays within the showcase');check([...d.querySelectorAll('.phase-list-scroll')].every(el=>w.getComputedStyle(el).overflowY==='auto'),'Phase lists scroll independently');check(new Set([...d.querySelectorAll('.legend .badge')].map(el=>w.getComputedStyle(el).backgroundColor)).size===4,'Four distinct classification colors');
for(let id of ['UC1','UC2','UC3','UC4','UC5']){let group=d.getElementById(id),tag=d.querySelector('.phase-entries .uc-'+id.toLowerCase());check(w.getComputedStyle(group).getPropertyValue('--uc')===w.getComputedStyle(tag).getPropertyValue('--uc'),'Consistent use-case color '+id)}
let scroll=d.querySelector('.phase-3 .phase-list-scroll');check(scroll.scrollHeight>scroll.clientHeight,'Long phase list has bounded height');scroll.scrollTop=200;check(scroll.scrollTop>0,'Phase feature list can scroll');
let card=d.querySelector('.home-phase.available');card.querySelector('.phase-card-heading').click();await new Promise(resolve=>{frame.onload=resolve});w=frame.contentWindow;d=w.document;check(w.location.pathname.endsWith('phase1.html'),'Clicking Phase 1 card navigates');check(d.querySelector('main .panel').classList.contains('pipeline-panel'),'Pipeline is the first Phase 1 section');check(d.querySelectorAll('.pipeline-block').length===8,'Eight updated pipeline blocks');check(w.getComputedStyle(d.querySelector('.pipeline-block'),'::after').content.includes('\u2192'),'Pipeline has connecting arrows');check(d.querySelectorAll('.feature-button').length===6,'Six numbered feature buttons');check([...d.querySelectorAll('.feature-button-number')].map(e=>e.textContent).join(',')==='1,2,3,4,5,6','Features numbered in source order');check(!d.querySelector('.ai-card'),'Previous detailed feature cards removed');
for(let a of [...d.querySelectorAll('a.feature-button')]){let response=await fetch(a.href);check(response.ok,'Feature destination '+a.getAttribute('href'))}
w=await load('feature.html?id=overwhelm');check(w.document.querySelectorAll('.research-panel').length===8&&w.document.querySelector('#research-panel-comparison'),'Feature 1 research hierarchy retained');check(!w.document.querySelector('.sidebar,#presentation'),'Feature page uses simplified shell');
for(let width of [320,390,700,768,850,1024,1440]){frame.style.width=width+'px';for(let path of ['index.html','phase1.html','feature.html?id=overwhelm']){w=await load(path);check(w.document.documentElement.scrollWidth<=w.innerWidth,'No page overflow '+width+' '+path);if(path==='index.html')check(w.getComputedStyle(w.document.querySelector('.home-phase-grid')).gridTemplateColumns.split(' ').length===(width>700?2:1),'Phase columns at '+width)}}
for(let path of ['features.html','phases.html','phase.html?id=3']){w=await load(path);await new Promise(r=>setTimeout(r,100));check(frame.contentWindow.location.pathname.endsWith('index.html'),'Legacy page returns to home '+path)}
}catch(e){fail++;lines.push('ERROR '+e.stack)}lines.push('\n'+count+' checks; '+fail+' failures.');document.querySelector('#results').textContent=lines.join('\n');document.body.dataset.status=fail?'failed':'passed';})();
</script></body></html>
