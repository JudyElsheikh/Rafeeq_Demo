<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Proposal checks</title></head><body><pre id="results">Running…</pre><iframe title="Proposal under test" style="width:1280px;height:900px"></iframe><script>
(async()=>{
 const frame=document.querySelector('iframe'),lines=[];let failed=0;
 const check=(ok,label)=>{lines.push((ok?'PASS ':'FAIL ')+label);if(!ok)failed++;};
 const load=path=>new Promise(resolve=>{frame.onload=()=>resolve(frame.contentWindow);frame.src='../'+path;});
 try{
 let w=await load('discover.html'),d=w.document;
 const visible=()=>[...d.querySelectorAll('.proposal-section')].filter(s=>!s.hidden);
 const selectTopic=number=>{const button=d.querySelector('[data-topic="proposal-'+number+'"]');if(button.closest('.topic-menu'))d.querySelector('.topic-more').open=true;button.click();};
 check(visible().length===1&&visible()[0].id==='proposal-1','Only the idea is initially displayed');
 check([...d.querySelectorAll('#proposal-1 strong')].some(el=>el.textContent==='Throughout the day'),'Original bold lead preserved');
 check(d.querySelectorAll('#proposal-1 ul>li').length===5,'Original idea bullets preserved');
 check(d.querySelectorAll('[data-topic]').length===12&&d.querySelector('[data-topic="proposal-1"]').hasAttribute('aria-current'),'Navigation contains all topics and marks the current section');
 check(!d.querySelector('.proposal-welcome').hidden,'Welcome shown on the first topic');
 check(d.querySelector('.site-header').contains(d.querySelector('.topbar'))&&d.querySelector('.site-header').contains(d.querySelector('.proposal-nav')),'Navigation attached to the top bar');
 check(w.getComputedStyle(d.querySelector('.site-header')).position==='sticky','Header and navigation stay together while scrolling');
 check(w.getComputedStyle(d.documentElement).getPropertyValue('--forest').trim()==='#123c2d','Dark green main brand color');
 selectTopic(9);
 check(visible().length===1&&visible()[0].id==='proposal-9','Topic click switches the displayed section');
 check(w.location.hash==='#proposal-9'&&d.querySelector('[data-topic="proposal-9"]').hasAttribute('aria-current')&&!d.querySelector('.topic-more').open,'Topic URL and navigation selection updated, menu closes');
 check(d.querySelector('.proposal-welcome').hidden,'Welcome hidden on subsequent topics');
 check(d.querySelectorAll('#proposal-9 table').length===2,'Both requirement tables retained');
 check(w.getComputedStyle(d.querySelector('#proposal-9 .proposal-table')).overflowY==='auto','Requirements scroll vertically');
 check(w.getComputedStyle(d.querySelector('#proposal-9 thead th')).position==='sticky','Table headers remain visible');
 selectTopic(7);d.querySelector('#tab-shared').click();
 check(!d.querySelector('#panel-shared').hidden&&d.querySelector('#panel-usecases').hidden,'Existing feature tabs work');
 const feature=d.querySelector('#panel-shared details');feature.querySelector('summary').click();
 check(feature.open,'Existing nested feature disclosure opens');
 selectTopic(11);
 check(d.querySelectorAll('#proposal-11 table').length===1,'Only the competitor matrix remains');
 check(d.querySelectorAll('#proposal-11 thead a').length===9,'All nine competitor destinations linked from matrix');
 check(!d.querySelector('#proposal-11').textContent.includes('Competitor links'),'No separate links heading');
 let historyChanged=new Promise(resolve=>w.addEventListener('popstate',resolve,{once:true}));w.history.back();await historyChanged;
 check(visible().length===1&&visible()[0].id==='proposal-7'&&d.querySelector('[data-topic="proposal-7"]').hasAttribute('aria-current'),'Browser back restores the previous topic and dropdown');
 historyChanged=new Promise(resolve=>w.addEventListener('popstate',resolve,{once:true}));w.history.forward();await historyChanged;
 check(visible().length===1&&visible()[0].id==='proposal-11'&&d.querySelector('[data-topic="proposal-11"]').hasAttribute('aria-current'),'Browser forward restores the next topic and dropdown');
 for(const width of [320,390,768,1280]){frame.style.width=width+'px';await new Promise(r=>setTimeout(r,100));check(d.documentElement.scrollWidth<=w.innerWidth,'No page overflow at '+width);const links=d.querySelector('.topic-links'),menu=d.querySelector('.topic-menu');check(links.children.length>0&&menu.children.length>0&&links.children.length+menu.children.length===12,'Topics fit with overflow in More at '+width);check(links.scrollWidth<=links.clientWidth,'Visible links fit without clipping at '+width);}
 w=await load('discover.html?qa=direct#proposal-8');d=w.document;
 check(visible().length===1&&visible()[0].id==='proposal-8','Direct section URL works');
 check(d.querySelector('.proposal-welcome').hidden,'Direct section URL hides introduction');
 w=await load('index.html');d=w.document;
 check(d.querySelector('.hero a[href="discover.html"]').textContent==='Discover More About Rafeeq','Home discovery link retained');
 }catch(error){failed++;lines.push(error.stack);}
 document.getElementById('results').textContent=lines.join('\n')+'\nFailures: '+failed;document.body.dataset.status=failed?'failed':'passed';
})();
</script></body></html>
