<!doctype html><html><head><meta charset="utf-8"><title>Feature 1 prototype checks</title></head><body><pre id="results">Running...</pre><iframe title="Prototype test" style="width:1280px;height:1000px"></iframe><script>
(async()=>{let lines=[],fail=0;const frame=document.querySelector('iframe');const check=(ok,label)=>{lines.push((ok?'PASS ':'FAIL ')+label);if(!ok)fail++};const load=path=>new Promise(resolve=>{frame.onload=()=>resolve(frame.contentWindow);frame.src='../'+path});try{let w=await load('feature.html?id=overwhelm'),d=w.document;check(d.querySelectorAll('.research-tabs [role=tab]').length===8,'Eight named tabs');check(d.querySelectorAll('.research-panel:not([hidden])').length===1,'Only one panel visible');check(!d.querySelector('.section-nav'),'Old section navigation replaced');for(let tab of d.querySelectorAll('.research-tabs button')){tab.click();check(!d.getElementById(tab.getAttribute('aria-controls')).hidden,'Tab opens: '+tab.textContent)}check(d.querySelector('#research-panel-comparison').textContent.includes('Pending')&&!d.querySelector('.metric-track'),'Evaluation contains no fabricated results');let colab=d.querySelector('#research-colab-url');colab.value='https://example.com';colab.dispatchEvent(new w.Event('input'));check(!d.querySelector('#research-colab-link a'),'Non-Colab URL rejected');colab.value='https://colab.research.google.com/drive/test';colab.dispatchEvent(new w.Event('input'));check(!!d.querySelector('#research-colab-link a'),'Colab URL creates notebook link');let last=d.querySelector('#research-tab-examples');last.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Home',bubbles:true}));check(d.querySelector('#research-tab-overview').getAttribute('aria-selected')==='true','Keyboard Home selects first tab');
for(let width of [320,390,768,1440]){frame.style.width=width+'px';for(let tab of d.querySelectorAll('.research-tabs button')){tab.click();check(d.documentElement.scrollWidth<=w.innerWidth,'No overflow '+width+' '+tab.textContent)}}
for(let id of ['focus-sleep','homework','off-task','chores']){w=await load(id+'.html');check(!!w.document.querySelector('.research-tabs')&&!w.document.querySelector('.section-nav'),'Research hierarchy: '+id)}
}catch(e){fail++;lines.push('ERROR '+e.stack)}lines.push('\n'+lines.length+' checks; '+fail+' failures.');document.querySelector('#results').textContent=lines.join('\n');document.body.dataset.status=fail?'failed':'passed'})();
</script></body></html>
